<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Driver's Cab Timer v3.0</title>
    <style>
        body {
            background-color: #050505;
            color: #d0d0d0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .cab-container {
            display: flex;
            background-color: #121212;
            border: 4px solid #2a2a2a;
            padding: 30px;
            box-shadow: inset 0 0 80px #000;
            gap: 40px;
            border-radius: 10px;
        }

        .monitor {
            background-color: #1a1e24;
            border: 8px solid #333;
            width: 520px;
            height: 400px;
            position: relative;
            padding: 10px;
            box-shadow: 0 0 20px #000;
        }

        .lamp-grid {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .lamp {
            background-color: #222;
            border: 1px solid #444;
            color: #444;
            font-size: 11px;
            width: 18px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: upright;
            border-radius: 2px;
        }

        .lamp.active-green { background-color: #080; color: #fff; box-shadow: 0 0 10px #0f0; }
        .lamp.active-red { background-color: #b00; color: #fff; box-shadow: 0 0 15px #f00; }

        .speedometer-wrap {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
        }

        .gauge-label {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: 14px;
            color: #888;
        }

        .gauge-label span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            width: 300px;
            text-align: center;
            margin-left: -150px;
            margin-top: -10px;
        }

        .val-0   { transform: rotate(-135deg) translateY(-125px) rotate(135deg); }
        .val-20  { transform: rotate(-101deg) translateY(-125px) rotate(101deg); }
        .val-40  { transform: rotate(-67deg)  translateY(-125px) rotate(67deg); }
        .val-60  { transform: rotate(-33deg)  translateY(-125px) rotate(33deg); }
        .val-80  { transform: rotate(0deg)    translateY(-125px) rotate(0deg); }
        .val-100 { transform: rotate(33deg)   translateY(-125px) rotate(-33deg); }
        .val-120 { transform: rotate(67deg)   translateY(-125px) rotate(-67deg); }
        .val-140 { transform: rotate(101deg)  translateY(-125px) rotate(-101deg); }
        .val-160 { transform: rotate(135deg)  translateY(-125px) rotate(-135deg); }

        .needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 120px;
            background: linear-gradient(to top, #ff3c00, #ff8c00);
            transform-origin: bottom center;
            transform: rotate(-135deg);
            transition: transform 1s linear;
            z-index: 10;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        .digital-speed {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            color: #ff6a00;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 15px #ff4800;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 180px;
            align-items: center;
        }

        .btn-label { font-size: 11px; margin-bottom: 3px; color: #888; }

        .round-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 6px solid #222;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            outline: none;
        }

        .btn-emergency {
            background-color: #700;
            color: #fff;
            box-shadow: 0 5px #300, inset 0 0 15px rgba(0,0,0,0.5);
        }
        .btn-emergency:active { transform: translateY(3px); box-shadow: 0 2px #300; }

        .btn-confirm {
            background-color: #ddd;
            color: #b00;
            border-color: #999;
            box-shadow: 0 5px #666;
        }
        .btn-confirm:active { transform: translateY(3px); box-shadow: 0 2px #666; }

        /* 警報持続ボタン（黄色がかった色） */
        .btn-chime-stop {
            background-color: #ece3a1;
            color: #7a6e00;
            border-color: #bdb068;
            box-shadow: 0 5px #7a713e;
        }
        .btn-chime-stop:active { transform: translateY(3px); box-shadow: 0 2px #7a713e; }

        .time-settings { text-align: center; width: 100%; margin-top: 10px; }
        .time-settings input {
            width: 50px;
            background: #000;
            color: #0f0;
            border: 1px solid #444;
            font-size: 18px;
            text-align: center;
        }

        .btn-start {
            margin-top: 10px;
            background: #333;
            color: #ddd;
            border: 1px solid #555;
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="cab-container">
    <div class="monitor">
        <div class="lamp-grid">
            <div class="lamp active-green">P電源</div>
            <div class="lamp" id="lamp-pattern">パターン</div>
            <div class="lamp" id="lamp-ats">ATS作動</div>
            <div class="lamp" id="lamp-brake">非常ブレーキ</div>
        </div>

        <div class="speedometer-wrap">
            <div class="gauge-label">
                <span class="val-0">0</span><span class="val-20">20</span><span class="val-40">40</span>
                <span class="val-60">60</span><span class="val-80">80</span><span class="val-100">100</span>
                <span class="val-120">120</span><span class="val-140">140</span><span class="val-160">160</span>
            </div>
            <div class="digital-speed" id="digitalSpeed">000</div>
            <div class="needle" id="needle"></div>
        </div>
    </div>

    <div class="control-panel">
        <div>
            <div class="btn-label">緊急停止</div>
            <button class="round-btn btn-emergency" id="emergencyBtn">緊 急</button>
        </div>
        <div>
            <div class="btn-label">ベル停止</div>
            <button class="round-btn btn-confirm" id="confirmBtn">ATS確認</button>
        </div>
        <div>
            <div class="btn-label">チャイム停止</div>
            <button class="round-btn btn-chime-stop" id="chimeStopBtn">警報持続</button>
        </div>

        <div class="time-settings">
            <input type="number" id="inputMin" value="0" min="0" max="2"> 分
            <input type="number" id="inputSec" value="10" min="0" max="59"> 秒
            <button class="btn-start" id="startBtn">運転開始</button>
        </div>
    </div>
</div>

<!-- 音源定義 -->
<audio id="sndAlarm" src="Alarm.wav" loop></audio>
<audio id="sndAlarmEnd" src="Alarm_end.wav"></audio>
<audio id="sndChime" src="chime.wav" loop></audio>
<audio id="sndChimeEnd" src="chime_end.wav"></audio>

<script>
    // 音源の読み込みエラーをチェックするコード
[sndAlarm, sndAlarmEnd, sndChime, sndChimeEnd].forEach(audio => {
    audio.addEventListener('error', (e) => {
        console.error(`ファイルが見つかりません: ${audio.src}`);
        alert(`エラー: ${audio.id} の読み込みに失敗しました。ファイル名を確認してください。`);
    });
});
    let timer = null;
    let currentSeconds = 0;
    let isAlarmRunning = false;
    let isChimeRunning = false;

    const needle = document.getElementById('needle');
    const digitalSpeed = document.getElementById('digitalSpeed');
    const lampAts = document.getElementById('lamp-ats');
    const lampBrake = document.getElementById('lamp-brake');

    const sndAlarm = document.getElementById('sndAlarm');
    const sndAlarmEnd = document.getElementById('sndAlarmEnd');
    const sndChime = document.getElementById('sndChime');
    const sndChimeEnd = document.getElementById('sndChimeEnd');

    function setSpeed(speed) {
        const angle = -135 + (speed * (270 / 160));
        needle.style.transform = `rotate(${angle}deg)`;
        digitalSpeed.innerText = String(Math.ceil(speed)).padStart(3, '0');
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const m = parseInt(document.getElementById('inputMin').value) || 0;
        const s = parseInt(document.getElementById('inputSec').value) || 0;
        currentSeconds = (m * 60) + s;
        if (currentSeconds <= 0) return;

        resetSystem();
        setSpeed(currentSeconds);
        timer = setInterval(() => {
            currentSeconds--;
            setSpeed(currentSeconds);
            if (currentSeconds <= 0) {
                triggerAlert();
            }
        }, 1000);
    });

    function triggerAlert() {
        clearInterval(timer);
        isAlarmRunning = true;
        isChimeRunning = true;
        lampAts.classList.add('active-red');
        sndAlarm.play();
        sndChime.play();
    }

    // ATS確認ボタン（ベル停止）
    document.getElementById('confirmBtn').addEventListener('click', () => {
        if (isAlarmRunning) {
            sndAlarm.pause();
            sndAlarm.currentTime = 0;
            sndAlarmEnd.play(); // 余韻再生
            isAlarmRunning = false;
            checkAllStopped();
        }
    });

    // 警報持続ボタン（チャイム停止）
    document.getElementById('chimeStopBtn').addEventListener('click', () => {
        if (isChimeRunning) {
            sndChime.pause();
            sndChime.currentTime = 0;
            sndChimeEnd.play(); // 余韻再生
            isChimeRunning = false;
            checkAllStopped();
        }
    });

    function checkAllStopped() {
        if (!isAlarmRunning && !isChimeRunning) {
            lampAts.classList.remove('active-red');
        }
    }

    document.getElementById('emergencyBtn').addEventListener('click', () => {
        resetSystem();
        lampBrake.classList.add('active-red');
        setSpeed(0);
    });

    function resetSystem() {
        clearInterval(timer);
        isAlarmRunning = false;
        isChimeRunning = false;
        sndAlarm.pause(); sndAlarm.currentTime = 0;
        sndChime.pause(); sndChime.currentTime = 0;
        sndAlarmEnd.pause(); sndAlarmEnd.currentTime = 0;
        sndChimeEnd.pause(); sndChimeEnd.currentTime = 0;
        lampAts.classList.remove('active-red');
        lampBrake.classList.remove('active-red');
    }
</script>
</body>
</html>
